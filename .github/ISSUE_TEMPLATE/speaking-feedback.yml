name: ChatGPT Live 练习反馈
description: 把 Live 结束时 ChatGPT 给出的摘要粘贴到这里，自动同步进度
title: "[Practice Feedback] "
labels: ["practice-feedback"]
body:
  - type: input
    id: date
    attributes: {label: 练习日期, placeholder: "2026-08-11"}
    validations: {required: true}
  - type: input
    id: topics
    attributes: {label: 完成的 Part 2 题号, description: "用逗号分隔，例如 P2-01, P2-17"}
    validations: {required: true}
  - type: dropdown
    id: fluency
    attributes: {label: Fluency 分数, options: ["5.0", "5.5", "6.0", "6.5", "7.0", "7.5", "8.0"]}
    validations: {required: true}
  - type: dropdown
    id: lexical
    attributes: {label: Lexical Resource 分数, options: ["5.0", "5.5", "6.0", "6.5", "7.0", "7.5", "8.0"]}
    validations: {required: true}
  - type: dropdown
    id: grammar
    attributes: {label: Grammar 分数, options: ["5.0", "5.5", "6.0", "6.5", "7.0", "7.5", "8.0"]}
    validations: {required: true}
  - type: dropdown
    id: pronunciation
    attributes: {label: Pronunciation 分数, options: ["5.0", "5.5", "6.0", "6.5", "7.0", "7.5", "8.0"]}
    validations: {required: true}
  - type: textarea
    id: corrections
    attributes: {label: 关键纠错, description: "粘贴 3 处 原句 → 改进句"}
    validations: {required: true}
  - type: textarea
    id: expressions
    attributes: {label: 可迁移表达, description: "粘贴今天积累的 5 个表达"}
  - type: textarea
    id: focus
    attributes: {label: 下一次只改进这一件事}
    validations: {required: true}
