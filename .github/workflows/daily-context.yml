name: Generate daily ChatGPT context
on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date (YYYY-MM-DD)"
        required: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate context
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then python scripts/generate_daily_context.py --date "$INPUT_DATE"; else python scripts/generate_daily_context.py; fi
      - name: Commit updated context
        run: |
          git config user.name "ielts-speaking-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-context
          git diff --cached --quiet || git commit -m "Update daily speaking context"
          git push
